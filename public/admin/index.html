<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
    h1{font-size:96px;margin:0;background:linear-gradient(90deg,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{color:#94a3b8;font-size:14px;margin:10px 0}
    a{color:#f97316;font-weight:600;text-decoration:none;margin-top:20px;padding:10px 22px;border:1px solid #f97316;border-radius:8px;display:inline-block;transition:all .2s}
    a:hover{background:#f97316;color:#fff}
  </style>
</head>
<body>
  <h1>404</h1>
  <p>The page you are looking for does not exist.</p>
  <a href="/">← Back to Home</a>
</body>
</html>
